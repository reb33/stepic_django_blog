services:

  postgres:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: postgres
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blog
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=ru_RU.UTF-8 --lc-ctype=ru_RU.UTF-8'

    ports:
      - 5432:5432